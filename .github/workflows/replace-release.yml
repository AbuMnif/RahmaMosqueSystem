name: Replace repository with Awn v1.1.3

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract and replace project
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="Awn-v1.1.3.zip"
          WORKFLOW=".github/workflows/replace-release.yml"

          if [ ! -f "$ARCHIVE" ]; then
            echo "Release archive not found: $ARCHIVE"
            exit 1
          fi

          mkdir -p /tmp/awn-release
          unzip -q "$ARCHIVE" -d /tmp/awn-release

          SOURCE="/tmp/awn-release"
          COUNT=$(find "$SOURCE" -mindepth 1 -maxdepth 1 | wc -l)

          if [ "$COUNT" -eq 1 ] && [ -d "$(find "$SOURCE" -mindepth 1 -maxdepth 1 -type d | head -n 1)" ]; then
            SOURCE="$(find "$SOURCE" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          fi

          # حذف المشروع القديم بالكامل
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name "$ARCHIVE" \
            -exec rm -rf {} +

          # نقل الإصدار الجديد إلى جذر المستودع
          cp -a "$SOURCE"/. .

          # حذف ملف الإصدار والوورك فلو
          rm -f "$ARCHIVE" "$WORKFLOW"

          # حفظ ورفع التغييرات
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Release Awn v1.1.3"
            git push
          fi
