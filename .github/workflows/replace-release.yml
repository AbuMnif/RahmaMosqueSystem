name: Replace repository with Awn v1.1.5

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace project files from release archive
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="Awn-v1.1.5.zip"
          WORKFLOW=".github/workflows/replace-release.yml"

          if [ ! -f "$ARCHIVE" ]; then
            echo "Release archive not found: $ARCHIVE"
            exit 1
          fi

          rm -rf /tmp/awn-release
          mkdir -p /tmp/awn-release
          unzip -q "$ARCHIVE" -d /tmp/awn-release

          SOURCE="/tmp/awn-release"
          COUNT="$(find "$SOURCE" -mindepth 1 -maxdepth 1 | wc -l)"

          if [ "$COUNT" -eq 1 ]; then
            ONLY_ENTRY="$(find "$SOURCE" -mindepth 1 -maxdepth 1 | head -n 1)"
            if [ -d "$ONLY_ENTRY" ]; then
              SOURCE="$ONLY_ENTRY"
            fi
          fi

          # Remove the previous project completely, keeping only Git metadata.
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            -exec rm -rf {} +

          # Copy the new release into the repository root.
          cp -a "$SOURCE"/. .

          # Remove the uploaded archive and this one-time workflow.
          rm -f "$ARCHIVE" "$WORKFLOW"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No project changes detected."
          else
            git commit -m "Release Awn v1.1.5"
            git push
          fi
