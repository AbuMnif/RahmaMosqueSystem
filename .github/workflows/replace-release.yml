name: Replace repository with version package

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace all project files from version archive
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="Awn-v1.1.0.zip"
          WORKFLOW=".github/workflows/replace-release.yml"

          test -f "$ARCHIVE" || {
            echo "Missing $ARCHIVE in repository root"
            exit 1
          }

          mkdir -p /tmp/awn-release
          unzip -q "$ARCHIVE" -d /tmp/awn-release

          SOURCE="/tmp/awn-release"

          entries=$(find "$SOURCE" -mindepth 1 -maxdepth 1 | wc -l)

          if [ "$entries" -eq 1 ] && [ -d "$(find "$SOURCE" -mindepth 1 -maxdepth 1 -type d | head -n 1)" ]; then
            SOURCE="$(find "$SOURCE" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          fi

          # حذف ملفات المشروع القديم
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name "$ARCHIVE" \
            -exec rm -rf {} +

          # نقل ملفات الإصدار الجديد إلى جذر المستودع
          cp -a "$SOURCE"/. .

          # حذف ملف الإصدار والوورك فلو المستخدم
          rm -f "$ARCHIVE" "$WORKFLOW"

          # حفظ التغييرات ورفعها إلى GitHub
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Replace project with Awn v1.1.0"
            git push
          fi
