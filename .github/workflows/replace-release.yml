name: Replace repository with Awn v1.1.4

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace project files
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="Awn-v1.1.4.zip"
          WORKFLOW=".github/workflows/replace-release.yml"

          test -f "$ARCHIVE" || {
            echo "Missing $ARCHIVE in repository root"
            exit 1
          }

          rm -rf /tmp/awn-release
          mkdir -p /tmp/awn-release
          unzip -q "$ARCHIVE" -d /tmp/awn-release

          SOURCE="/tmp/awn-release"
          COUNT=$(find "$SOURCE" -mindepth 1 -maxdepth 1 | wc -l)

          if [ "$COUNT" -eq 1 ] && [ -d "$(find "$SOURCE" -mindepth 1 -maxdepth 1 -type d | head -n 1)" ]; then
            SOURCE="$(find "$SOURCE" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          fi

          # حذف ملفات المشروع القديم
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name "$ARCHIVE" \
            -exec rm -rf {} +

          # نقل ملفات الإصدار الجديد
          cp -a "$SOURCE"/. .

          # حذف ملف ZIP والوورك فلو
          rm -f "$ARCHIVE" "$WORKFLOW"

          # حفظ التغييرات ورفعها
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Release Awn v1.1.4"
            git push
          fi
