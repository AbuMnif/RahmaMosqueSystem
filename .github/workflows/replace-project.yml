name: Replace Project From ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check ZIP file
        run: |
          if [ ! -f "AwnMosqueSystem.zip" ]; then
            echo "ERROR: AwnMosqueSystem.zip was not found."
            exit 1
          fi

      - name: Extract project archive
        run: |
          mkdir -p /tmp/awn-project
          unzip -q AwnMosqueSystem.zip -d /tmp/awn-project

      - name: Detect project folder
        id: detect
        run: |
          ITEMS=$(find /tmp/awn-project -mindepth 1 -maxdepth 1)
          COUNT=$(echo "$ITEMS" | wc -l)

          if [ "$COUNT" -eq 1 ] && [ -d "$ITEMS" ]; then
            echo "source=$ITEMS" >> "$GITHUB_OUTPUT"
          else
            echo "source=/tmp/awn-project" >> "$GITHUB_OUTPUT"
          fi

      - name: Remove old project files
        run: |
          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -name "AwnMosqueSystem.zip" \
            -exec rm -rf {} +

      - name: Copy new project to repository root
        run: |
          cp -a "${{ steps.detect.outputs.source }}/." .

      - name: Remove temporary files
        run: |
          rm -rf /tmp/awn-project

      - name: Delete this workflow
        run: |
          rm -f .github/workflows/replace-project.yml

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Replace project with AwnMosqueSystem ZIP and remove temporary workflow"
            git push
          fi
